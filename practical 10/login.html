<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Portal - Sign In</title>
    <style>
      body {
        align-items: center;
        background: #f3f6f9;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 18px #00000014;
        padding: 2rem;
        width: min(22rem, calc(100% - 4rem));
      }

      h1 {
        margin-top: 0;
      }

      label {
        display: block;
        font-weight: 600;
        margin-top: 1rem;
      }

      input {
        box-sizing: border-box;
        margin-top: 0.4rem;
        padding: 0.7rem;
        width: 100%;
      }

      button {
        background: #145da0;
        border: 0;
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        font-size: 1rem;
        margin-top: 1.25rem;
        padding: 0.75rem;
        width: 100%;
      }

      #message {
        min-height: 1.5rem;
      }

      #message.error {
        color: #a61b1b;
      }

      #message.success {
        color: #176b35;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <form id="login-form">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Sign in</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script>
      const form = document.querySelector("#login-form");
      const message = document.querySelector("#message");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        message.className = "";

        const email = form.elements.email.value.trim();
        const password = form.elements.password.value;
        if (email === "student@example.com" && password === "DemoPass123!") {
          message.textContent = "Sign-in successful.";
          message.classList.add("success");
          return;
        }

        message.textContent = "Invalid email or password.";
        message.classList.add("error");
      });
    </script>
  </body>
</html>
